name: Build UDIN EXTERNAL IOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make scripts executable
        run: chmod +x ./build_unsigned.sh ./build_esign_ready_ipa.sh

      - name: Build unsigned IPA
        run: ./build_unsigned.sh

      - name: Verify eSign-ready IPA
        run: ./build_esign_ready_ipa.sh build/UDIN-EXTERNAL-IOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDIN-EXTERNAL-IOS-unsigned-ipa
          path: build/UDIN-EXTERNAL-IOS-unsigned.ipa
          retention-days: 7
